name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PackingManager for Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        id: unit_tests
        shell: powershell
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          $failedFiles = @()
          foreach ($testFile in Get-ChildItem tests\test_*.py) {
            $details = python -m unittest discover -s tests -p $testFile.Name -v 2>&1 |
              Out-String
            $testExitCode = $LASTEXITCODE
            Write-Output $details
            if ($testExitCode -ne 0) {
              $failedFiles += $testFile.Name
              if ($details.Length -gt 3000) {
                $details = $details.Substring($details.Length - 3000)
              }
              $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error file=tests/$($testFile.Name),line=1,title=Windows test failure::$details"
            }
          }
          if ($failedFiles.Count -gt 0) {
            Write-Host "Failed test files: $($failedFiles -join ', ')"
            exit 1
          }

      - name: Build Windows onedir bundle
        run: python -m PyInstaller --noconfirm --clean PackingManager.spec

      - name: Smoke-test packaged exe
        run: dist\PackingManager\PackingManager.exe --smoke-test

      - name: Create distribution ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\PackingManager\*" `
            -DestinationPath "dist\PackingManager-windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PackingManager-windows
          path: dist/PackingManager-windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Preserve unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1
