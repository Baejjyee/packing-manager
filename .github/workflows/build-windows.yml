name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PackingManager for Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build Windows onedir bundle
        run: python -m PyInstaller --noconfirm --clean PackingManager.spec

      - name: Smoke-test packaged exe
        run: dist\PackingManager\PackingManager.exe --smoke-test

      - name: Create distribution ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\PackingManager\*" `
            -DestinationPath "dist\PackingManager-windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PackingManager-windows
          path: dist/PackingManager-windows.zip
          if-no-files-found: error
          retention-days: 14
